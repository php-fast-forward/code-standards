version: 2
updates:
  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "Composer"
      include: "scope"
    groups:
      composer-production:
        applies-to: "version-updates"
        dependency-type: "production"
        patterns: ["*"]
        update-types: ["minor", "patch"]
      composer-development:
        applies-to: "version-updates"
        dependency-type: "development"
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "GitHub Actions"
      include: "scope"
    groups:
      github-actions:
        applies-to: "version-updates"
        patterns: ["*"]
        update-types: ["minor", "patch"]
