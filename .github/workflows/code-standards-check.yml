name: 'Internal: Check Changed PHP'
on:
  workflow_call:
    inputs:
      php-version:
        default: '8.3'
        type: string
      config:
        default: ''
        type: string
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Reject privileged events and invalid refs
        id: runtime
        env:
          STANDARDS_EVENT: ${{ github.event_name }}
          STANDARDS_JOB_JSON: ${{ toJSON(job) }}
          STANDARDS_BASE: ${{ github.event.pull_request.base.sha }}
          STANDARDS_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          [[ "$STANDARDS_EVENT" == pull_request ]] || exit 1
          [[ "$STANDARDS_BASE" =~ ^[a-fA-F0-9]{40}$ ]] || exit 1
          [[ "$STANDARDS_HEAD" =~ ^[a-fA-F0-9]{40}$ ]] || exit 1
          runtime=$(jq --slurp --raw-output --exit-status '
            select(length == 1) | .[0] | select(type == "object")
            | select(.workflow_repository | type == "string")
            | select(.workflow_repository == "php-fast-forward/code-standards")
            | select(.workflow_sha | type == "string")
            | select(.workflow_sha | length == 40 and test("^[a-f0-9]+$"))
            | .workflow_sha
          ' <<< "$STANDARDS_JOB_JSON") || {
            echo '::error::Invalid executing workflow identity in native job context.' >&2
            exit 1
          }
          {
            printf 'repository=php-fast-forward/code-standards\n'
            printf 'sha=%s\n' "$runtime"
          } >> "$GITHUB_OUTPUT"
      - name: Check out reviewed tool runtime
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ steps.runtime.outputs.repository }}
          ref: ${{ steps.runtime.outputs.sha }}
          path: tool
          persist-credentials: false
      - name: Set up PHP
        uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc # 2.37.1
        with:
          php-version: ${{ inputs.php-version }}
          coverage: none
          tools: composer:v2
      - name: Install only the reviewed tool
        working-directory: tool
        env:
          COMPOSER_HOME: ${{ runner.temp }}/standards-composer-home
          COMPOSER_CACHE_DIR: ${{ runner.temp }}/standards-composer-cache
        run: composer install --no-dev --no-plugins --no-scripts --no-interaction --prefer-dist --no-progress
      - name: Check out exact consumer head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: consumer
          fetch-depth: 0
          persist-credentials: false
      - name: Check changed PHP
        uses: ./tool/.github/actions/check
        with:
          directory: ${{ github.workspace }}/consumer
          base-sha: ${{ github.event.pull_request.base.sha }}
          head-sha: ${{ github.event.pull_request.head.sha }}
          config: ${{ inputs.config }}
