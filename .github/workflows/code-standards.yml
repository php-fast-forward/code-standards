name: 'Reusable: Code Standards'
on:
  workflow_call:
    inputs:
      runtime-ref:
        description: Reviewed full commit SHA matching this workflow ref.
        required: true
        type: string
      php-version:
        description: Tool runtime PHP, at least 8.3; also used for syntax parsing.
        default: '8.3'
        type: string
      config:
        description: Optional consumer-relative ECS config.
        default: ''
        type: string
permissions: {}
jobs:
  check:
    permissions:
      contents: read
    uses: ./.github/workflows/code-standards-check.yml
    with:
      runtime-ref: ${{ inputs.runtime-ref }}
      php-version: ${{ inputs.php-version }}
      config: ${{ inputs.config }}
