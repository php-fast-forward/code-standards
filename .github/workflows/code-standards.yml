name: 'Reusable: Code Standards'
on:
  workflow_call:
    inputs:
      runs-on:
        description: JSON Linux self-hosted labels for data-only same-repository PR checks; executable config, Rector and forks use hosted Ubuntu.
        default: '["ubuntu-latest"]'
        type: string
      php-version:
        description: Tool runtime PHP, at least 8.3; also used for syntax parsing.
        default: '8.3'
        type: string
      normalize-composer:
        description: Explicitly check root Composer metadata without writing or updating locks.
        default: false
        type: boolean
      config:
        description: Optional consumer-relative ECS config.
        default: ''
        type: string
      magic-numbers:
        description: Explicitly enable native Magic Numbers analysis of the exact PR selection.
        default: false
        type: boolean
      magic-numbers-policy:
        description: report or fail for verified findings; operational errors always fail.
        default: report
        type: string
      rector:
        description: Explicitly enable native semantic preview using rector-config, never apply.
        default: false
        type: boolean
      rector-policy:
        description: report or fail for verified proposed changes; operational errors always fail.
        default: report
        type: string
      rector-config:
        description: Consumer-relative native PHP configuration with explicit target and rules.
        default: ''
        type: string
permissions: {}
jobs:
  check:
    permissions:
      contents: read
    uses: ./.github/workflows/code-standards-check.yml
    with:
      runs-on: ${{ inputs.runs-on }}
      php-version: ${{ inputs.php-version }}
      config: ${{ inputs.config }}
      normalize-composer: ${{ inputs.normalize-composer }}
  optional-analysis:
    permissions:
      contents: read
    uses: ./.github/workflows/code-standards-analysis.yml
    with:
      runs-on: ${{ inputs.runs-on }}
      php-version: ${{ inputs.php-version }}
      magic-numbers: ${{ inputs.magic-numbers }}
      magic-numbers-policy: ${{ inputs.magic-numbers-policy }}
      rector: ${{ inputs.rector }}
      rector-policy: ${{ inputs.rector-policy }}
      rector-config: ${{ inputs.rector-config }}
