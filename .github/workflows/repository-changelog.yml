name: 'Repository: Changelog'
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled, closed]
  push:
    branches: [main]
  workflow_dispatch:
permissions: {}
jobs:
  changelog:
    permissions:
      contents: write
      pull-requests: write
      issues: read
      statuses: write
    # Candidate API from Changelog PR76; adopt a verified compatible release before stable rollout.
    uses: php-fast-forward/changelog/.github/workflows/changelog.yml@7892d45fef7ef3453172387692f9f72b9d28b6fb
    with:
      runs-on: '["ubuntu-latest"]'
      base-branch: main
      source: tags
      prepare-release: true
      publish: true
      publish-app-client-id: 'Iv23liHqRng02H747IYa'
      publish-environment: release-channels
    secrets:
      publish-app-private-key: ${{ secrets.RELEASE_CHANNEL_APP_PRIVATE_KEY }}
