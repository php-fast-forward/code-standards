name: 'Repository: Changelog'
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled, closed]
  push:
    branches: [main]
  workflow_dispatch:
permissions: {}
jobs:
  changelog:
    permissions:
      contents: write
      pull-requests: write
      issues: read
      statuses: write
    uses: php-fast-forward/changelog/.github/workflows/changelog.yml@v0
    with:
      runs-on: '["ubuntu-latest"]'
      base-branch: main
      source: tags
      prepare-release: true
      publish: true
