name: 'Repository: Changelog'
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled, closed]
  push:
    branches: [main]
  workflow_dispatch:
permissions: {}
jobs:
  changelog:
    permissions:
      contents: write
      pull-requests: write
      issues: read
      statuses: write
    uses: php-fast-forward/changelog/.github/workflows/changelog.yml@85474de5a16bb08f83c9f30e0ed72f331a210f07 # v0.3.0
    with:
      runs-on: '["ubuntu-latest"]'
      base-branch: main
      source: tags
      prepare-release: true
      publish: true
  release-channels:
    needs: changelog
    if: >-
      needs.changelog.outputs.published-version != '' &&
      needs.changelog.outputs.published-sha != ''
    permissions:
      contents: write
    uses: ./.github/workflows/repository-release-channels.yml
    with:
      tag: ${{ needs.changelog.outputs.published-tag }}
      expected-sha: ${{ needs.changelog.outputs.published-sha }}
