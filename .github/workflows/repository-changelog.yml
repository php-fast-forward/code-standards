name: 'Repository: Changelog'
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled, closed]
  push:
    branches: [main]
  workflow_dispatch:
permissions: {}
jobs:
  changelog:
    permissions:
      contents: write
      pull-requests: write
      issues: read
      statuses: write
    # Reviewed integration candidate combines publication API and original-PR provenance fixes.
    uses: php-fast-forward/changelog/.github/workflows/changelog.yml@41020df0dcd4cb9a2b990f54077553deefbd7608
    with:
      runs-on: '["ubuntu-latest"]'
      base-branch: main
      managed-branch: changelog/version-recovery-98
      source: tags
      prepare-release: true
      publish: true
      publish-app-client-id: 'Iv23liHqRng02H747IYa'
      publish-environment: release-channels
    secrets:
      publish-app-private-key: ${{ secrets.RELEASE_CHANNEL_APP_PRIVATE_KEY }}
