name: 'Repository: Quality'
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, posix
          coverage: none
          tools: composer:v2
      - run: composer install --no-plugins --no-scripts --no-interaction --prefer-dist --no-progress
        env:
          COMPOSER_HOME: ${{ runner.temp }}/standards-composer-home
          COMPOSER_CACHE_DIR: ${{ runner.temp }}/standards-composer-cache
      - run: composer validate --strict
      - name: Check Composer normalization
        env:
          STANDARDS_ROOT: ${{ github.workspace }}
          STANDARDS_DIRECTORY: ${{ github.workspace }}
        run: |
          php "$STANDARDS_ROOT/bin/code-standards" normalize-composer "--directory=$STANDARDS_DIRECTORY"
      - run: composer check
      - name: Qualify ready PHAR distribution and native runtime
        env:
          COMPOSER_HOME: ${{ runner.temp }}/standards-phar-composer-home
          COMPOSER_CACHE_DIR: ${{ runner.temp }}/standards-composer-cache
          COMPOSER_ROOT_VERSION: dev-phar-poc
        run: |
          php -d phar.readonly=0 scripts/phar/build.php "$RUNNER_TEMP/code-standards"
          php scripts/phar/verify.php "$RUNNER_TEMP/code-standards"
      - name: Provision isolated Twig evaluation dependencies
        run: composer install --working-dir=tests/Evaluation/Twig --no-dev --no-plugins --no-scripts --no-interaction --prefer-dist --no-progress
        env:
          COMPOSER_HOME: ${{ runner.temp }}/standards-twig-composer-home
          COMPOSER_CACHE_DIR: ${{ runner.temp }}/standards-twig-composer-cache
          COMPOSER_VENDOR_DIR: ${{ runner.temp }}/standards-twig-vendor
      - name: Evaluate native Twig contracts
        run: php tests/Evaluation/Twig/evaluate.php
        env:
          TWIG_EVALUATION_AUTOLOAD: ${{ runner.temp }}/standards-twig-vendor/autoload.php
          TWIG_EVALUATION_TEMP: ${{ runner.temp }}
      - run: git diff --exit-code
