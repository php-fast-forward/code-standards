name: 'Repository: Quality'
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, posix
          coverage: none
          tools: composer:v2, box:4.7.1
      - run: composer install --no-plugins --no-scripts --no-interaction --prefer-dist --no-progress
        env:
          COMPOSER_HOME: ${{ runner.temp }}/standards-composer-home
          COMPOSER_CACHE_DIR: ${{ runner.temp }}/standards-composer-cache
      - run: composer validate --strict
      - name: Check Composer normalization
        env:
          STANDARDS_ROOT: ${{ github.workspace }}
          STANDARDS_DIRECTORY: ${{ github.workspace }}
        run: |
          php "$STANDARDS_ROOT/bin/code-standards" normalize-composer "--directory=$STANDARDS_DIRECTORY"
      - run: composer check
      - name: Qualify ready PHAR distribution and native runtime
        env:
          COMPOSER_HOME: ${{ runner.temp }}/standards-phar-composer-home
          COMPOSER_CACHE_DIR: ${{ runner.temp }}/standards-composer-cache
        run: |
          php scripts/phar/prepare.php "$RUNNER_TEMP/standards-runtime"
          box validate "$RUNNER_TEMP/standards-runtime/box.json"
          box compile --no-parallel --sort-compiled-files --config="$RUNNER_TEMP/standards-runtime/box.json"
          install -m 755 "$RUNNER_TEMP/standards-runtime/dist/code-standards" "$RUNNER_TEMP/code-standards"
          box verify "$RUNNER_TEMP/code-standards"
          STANDARDS_PHAR="$RUNNER_TEMP/code-standards" vendor/bin/phpunit tests/Distribution/ArchiveTest.php --filter testCompiledDistributionRunsInDisposableConsumers
      - name: Compare the committed executable before execution
        id: parity
        shell: bash
        run: |
          set +e
          cmp "$RUNNER_TEMP/code-standards" dist/code-standards
          status=$?
          set -e
          case "$status" in
            0) echo 'stale=false' >> "$GITHUB_OUTPUT" ;;
            1) echo 'stale=true' >> "$GITHUB_OUTPUT" ;;
            *) exit "$status" ;;
          esac
      - name: Qualify the committed Composer distribution
        if: steps.parity.outputs.stale == 'false'
        run: |
          STANDARDS_PHAR="$GITHUB_WORKSPACE/dist/code-standards" vendor/bin/phpunit tests/Distribution/ArchiveTest.php --filter testCompiledDistributionRunsInDisposableConsumers
      - name: Provision isolated Twig evaluation dependencies
        run: composer install --working-dir=tests/Evaluation/Twig --no-dev --no-plugins --no-scripts --no-interaction --prefer-dist --no-progress
        env:
          COMPOSER_HOME: ${{ runner.temp }}/standards-twig-composer-home
          COMPOSER_CACHE_DIR: ${{ runner.temp }}/standards-twig-composer-cache
          COMPOSER_VENDOR_DIR: ${{ runner.temp }}/standards-twig-vendor
      - name: Evaluate native Twig contracts
        run: php tests/Evaluation/Twig/evaluate.php
        env:
          TWIG_EVALUATION_AUTOLOAD: ${{ runner.temp }}/standards-twig-vendor/autoload.php
          TWIG_EVALUATION_TEMP: ${{ runner.temp }}
      - run: git diff --exit-code
      - name: Retain the reviewed PHP 8.3 build
        if: matrix.php == '8.3'
        uses: actions/upload-artifact@v7
        with:
          name: code-standards-${{ steps.parity.outputs.stale == 'true' && 'update-' || '' }}${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/code-standards
          compression-level: 0
          if-no-files-found: error
      - name: Require the compiled refresh to pass on its own commit
        if: steps.parity.outputs.stale == 'true'
        run: |
          echo 'The committed executable is stale. The trusted refresh workflow may update this same-repository PR; CI must pass again on that commit.' >&2
          exit 1
  refresh:
    needs: tests
    if: >-
      failure() && needs.tests.result == 'failure' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: release-channels
    steps:
      - name: Download the qualified update, if one was produced
        id: artifact
        continue-on-error: true
        uses: actions/download-artifact@v8.0.2
        with:
          name: code-standards-update-${{ github.event.pull_request.head.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/phar-update
      - if: steps.artifact.outcome == 'success'
        id: writer
        uses: actions/create-github-app-token@v3.3.0
        with:
          client-id: 'Iv23liHqRng02H747IYa'
          private-key: ${{ secrets.RELEASE_CHANNEL_APP_PRIVATE_KEY }}
          owner: php-fast-forward
          repositories: code-standards
          permission-contents: write
      - if: steps.artifact.outcome == 'success'
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          token: ${{ steps.writer.outputs.token }}
      - if: steps.artifact.outcome == 'success'
        run: |
          test "$(git log -1 --format=%s)" != 'build: refresh compiled executable'
          test -f dist/code-standards && test ! -L dist && test ! -L dist/code-standards
          test -f "$RUNNER_TEMP/phar-update/code-standards" && test ! -L "$RUNNER_TEMP/phar-update/code-standards"
          install -m 755 "$RUNNER_TEMP/phar-update/code-standards" dist/code-standards
      - if: steps.artifact.outcome == 'success'
        uses: stefanzweifel/git-auto-commit-action@v7.2.1
        with:
          branch: ${{ github.head_ref }}
          file_pattern: dist/code-standards
          commit_message: 'build: refresh compiled executable'
          skip_checkout: true
          skip_fetch: true
