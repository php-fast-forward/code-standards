name: 'Repository: Quality'
on:
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  inputs:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.inputs.outputs.build }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: inputs
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT: ${{ github.event_name }}
        shell: bash
        run: |
          build=true
          if git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            if test "$EVENT" = pull_request; then
              BASE=$(git merge-base "$BASE" "$HEAD")
            fi
            git diff --no-renames --name-only -z "$BASE" "$HEAD" > "$RUNNER_TEMP/phar-inputs"
            build=false
            while IFS= read -r -d '' path; do
              case "$path" in
                tests/Distribution/*|tests/Fixtures/*|.github/workflows/repository-ci.yml|.github/workflows/repository-phar-refresh.yml) build=true ;;
                docs/*|.changelog/*|tests/*|.github/*|README.md|CHANGELOG.md|AGENTS.md|.editorconfig|.gitignore|phpunit.xml*) ;;
                *) build=true ;;
              esac
            done < "$RUNNER_TEMP/phar-inputs"
          fi
          echo "build=$build" >> "$GITHUB_OUTPUT"
  build:
    needs: inputs
    if: needs.inputs.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      stale: ${{ steps.parity.outputs.stale }}
      artifact: ${{ steps.candidate.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: dom, posix
          coverage: none
          tools: composer:v2, box:4.7.1
      - run: composer install --no-plugins --no-scripts --no-interaction --prefer-dist --no-progress
        env:
          COMPOSER_HOME: ${{ runner.temp }}/standards-composer-home
          COMPOSER_CACHE_DIR: ${{ runner.temp }}/standards-composer-cache
      - name: Build once with the canonical PHP runtime
        env:
          COMPOSER_HOME: ${{ runner.temp }}/standards-phar-composer-home
          COMPOSER_CACHE_DIR: ${{ runner.temp }}/standards-composer-cache
        run: |
          php scripts/phar/prepare.php "$RUNNER_TEMP/standards-runtime"
          box validate "$RUNNER_TEMP/standards-runtime/box.json"
          box compile --no-parallel --sort-compiled-files --config="$RUNNER_TEMP/standards-runtime/box.json"
          install -m 755 "$RUNNER_TEMP/standards-runtime/dist/code-standards" "$RUNNER_TEMP/code-standards"
          box verify "$RUNNER_TEMP/code-standards"
      - name: Compare the committed executable before execution
        id: parity
        shell: bash
        run: |
          set +e
          cmp "$RUNNER_TEMP/code-standards" dist/code-standards
          status=$?
          set -e
          case "$status" in
            0) echo 'stale=false' >> "$GITHUB_OUTPUT" ;;
            1) echo 'stale=true' >> "$GITHUB_OUTPUT" ;;
            *) exit "$status" ;;
          esac
      - name: Qualify the identical committed executable
        if: steps.parity.outputs.stale == 'false'
        run: |
          STANDARDS_PHAR="$GITHUB_WORKSPACE/dist/code-standards" vendor/bin/phpunit tests/Distribution/ArchiveTest.php --filter testCompiledDistributionRunsInDisposableConsumers
      - id: candidate
        uses: actions/upload-artifact@v7
        with:
          name: code-standards-build-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/code-standards
          compression-level: 0
          if-no-files-found: error
  runtime:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, posix
          coverage: none
          tools: composer:v2
      - run: composer install --no-plugins --no-scripts --no-interaction --prefer-dist --no-progress
        env:
          COMPOSER_HOME: ${{ runner.temp }}/standards-composer-home
          COMPOSER_CACHE_DIR: ${{ runner.temp }}/standards-composer-cache
      - uses: actions/download-artifact@v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact }}
          merge-multiple: true
          path: ${{ runner.temp }}/phar
      - name: Qualify the same compiled bytes on every supported PHP
        run: |
          chmod 755 "$RUNNER_TEMP/phar/code-standards"
          STANDARDS_PHAR="$RUNNER_TEMP/phar/code-standards" vendor/bin/phpunit tests/Distribution/ArchiveTest.php --filter testCompiledDistributionRunsInDisposableConsumers
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, posix
          coverage: none
          tools: composer:v2
      - run: composer install --no-plugins --no-scripts --no-interaction --prefer-dist --no-progress
        env:
          COMPOSER_HOME: ${{ runner.temp }}/standards-composer-home
          COMPOSER_CACHE_DIR: ${{ runner.temp }}/standards-composer-cache
      - run: composer validate --strict
      - name: Check Composer normalization
        env:
          STANDARDS_ROOT: ${{ github.workspace }}
          STANDARDS_DIRECTORY: ${{ github.workspace }}
        run: |
          php "$STANDARDS_ROOT/bin/code-standards" normalize-composer "--directory=$STANDARDS_DIRECTORY"
      - run: composer check
      - name: Provision isolated Twig evaluation dependencies
        run: composer install --working-dir=tests/Evaluation/Twig --no-dev --no-plugins --no-scripts --no-interaction --prefer-dist --no-progress
        env:
          COMPOSER_HOME: ${{ runner.temp }}/standards-twig-composer-home
          COMPOSER_CACHE_DIR: ${{ runner.temp }}/standards-twig-composer-cache
          COMPOSER_VENDOR_DIR: ${{ runner.temp }}/standards-twig-vendor
      - name: Evaluate native Twig contracts
        run: php tests/Evaluation/Twig/evaluate.php
        env:
          TWIG_EVALUATION_AUTOLOAD: ${{ runner.temp }}/standards-twig-vendor/autoload.php
          TWIG_EVALUATION_TEMP: ${{ runner.temp }}
      - run: git diff --exit-code
  compiled:
    needs: [build, tests, runtime]
    if: always() && needs.build.result != 'skipped'
    runs-on: ubuntu-latest
    steps:
      - name: Require successful source and artifact qualification
        env:
          BUILD: ${{ needs.build.result }}
          TESTS: ${{ needs.tests.result }}
          RUNTIME: ${{ needs.runtime.result }}
        run: |
          test "$BUILD" = success && test "$TESTS" = success && test "$RUNTIME" = success
      - if: needs.build.outputs.stale == 'true'
        uses: actions/download-artifact@v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact }}
          merge-multiple: true
          path: ${{ runner.temp }}/phar
      - name: Retain only a fully qualified update
        if: needs.build.outputs.stale == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: code-standards-update-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/phar/code-standards
          compression-level: 0
          if-no-files-found: error
      - name: Require the refresh to pass before merge
        if: needs.build.outputs.stale == 'true'
        run: |
          echo 'The executable needs the qualified update. CI must pass on the refreshed commit before merge.' >&2
          exit 1
