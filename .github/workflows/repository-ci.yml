name: 'Repository: Quality'
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reusable-check:
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/code-standards.yml
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2
      - run: composer install --no-plugins --no-scripts --no-interaction --prefer-dist --no-progress
        env:
          COMPOSER_HOME: ${{ runner.temp }}/standards-composer-home
          COMPOSER_CACHE_DIR: ${{ runner.temp }}/standards-composer-cache
      - run: composer validate --strict
      - run: composer check
      - run: git diff --exit-code
