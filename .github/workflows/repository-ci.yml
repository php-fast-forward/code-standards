name: 'Repository: Quality'
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, posix
          coverage: none
          tools: composer:v2
      - run: composer install --no-plugins --no-scripts --no-interaction --prefer-dist --no-progress
        env:
          COMPOSER_HOME: ${{ runner.temp }}/standards-composer-home
          COMPOSER_CACHE_DIR: ${{ runner.temp }}/standards-composer-cache
      - run: composer validate --strict
      - name: Check Composer normalization
        env:
          STANDARDS_ROOT: ${{ github.workspace }}
          STANDARDS_DIRECTORY: ${{ github.workspace }}
        run: |
          php "$STANDARDS_ROOT/bin/code-standards" normalize-composer "--directory=$STANDARDS_DIRECTORY"
      - run: composer check
      - name: Qualify ready PHAR distribution and native runtime
        env:
          COMPOSER_HOME: ${{ runner.temp }}/standards-phar-composer-home
          COMPOSER_CACHE_DIR: ${{ runner.temp }}/standards-composer-cache
          COMPOSER_ROOT_VERSION: dev-phar-poc
        run: |
          PHAR_RUNTIME="$RUNNER_TEMP/standards-phar-runtime"
          mkdir -p "$PHAR_RUNTIME"
          cp -R src config bin resources composer.json composer.lock LICENSE "$PHAR_RUNTIME/"
          composer install --working-dir="$PHAR_RUNTIME" --no-dev --no-plugins --no-scripts --no-interaction --prefer-dist --no-progress
          python3 scripts/phar/verify.py "$PHAR_RUNTIME" "$RUNNER_TEMP/standards-phar-transport" --gzip
          python3 scripts/phar/verify-runtime.py "$RUNNER_TEMP/standards-phar-transport" "$RUNNER_TEMP/standards-phar-native" php
          python3 scripts/phar/verify-vcs-dist.py "$RUNNER_TEMP/standards-phar-transport" "$RUNNER_TEMP/standards-phar-vcs"
          python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); print({"status":d["status"],"versions_and_modules":d["versions_and_modules"]})' "$RUNNER_TEMP/standards-phar-native/result.json"
      - name: Provision isolated Twig evaluation dependencies
        run: composer install --working-dir=tests/Evaluation/Twig --no-dev --no-plugins --no-scripts --no-interaction --prefer-dist --no-progress
        env:
          COMPOSER_HOME: ${{ runner.temp }}/standards-twig-composer-home
          COMPOSER_CACHE_DIR: ${{ runner.temp }}/standards-twig-composer-cache
          COMPOSER_VENDOR_DIR: ${{ runner.temp }}/standards-twig-vendor
      - name: Evaluate native Twig contracts
        run: php tests/Evaluation/Twig/evaluate.php
        env:
          TWIG_EVALUATION_AUTOLOAD: ${{ runner.temp }}/standards-twig-vendor/autoload.php
          TWIG_EVALUATION_TEMP: ${{ runner.temp }}
      - run: git diff --exit-code
