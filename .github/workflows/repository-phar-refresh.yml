name: 'Repository: Refresh compiled executable'
on:
  workflow_run:
    workflows: ['Repository: Quality']
    types: [completed]
permissions:
  contents: read
  actions: read
  pull-requests: read
concurrency:
  group: phar-refresh-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false
jobs:
  refresh:
    if: >-
      github.repository == 'php-fast-forward/code-standards' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.head_repository.id == github.event.repository.id
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release-channels
    steps:
      # This revision belongs to the trusted default-branch callback, never the PR.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Inspect the completed run and current pull request
        id: inspect
        uses: actions/github-script@v9
        with:
          script: |
            const helper = require('./.github/PharCommit/commit.cjs');
            const result = await helper.inspect({github, context, core});
            core.setOutput('eligible', String(result.eligible));
            if (result.eligible) {
              core.setOutput('candidate', JSON.stringify(result.candidate));
              core.setOutput('artifact-id', String(result.candidate.artifactId));
            }
      - name: Download only the inspected run artifact
        if: steps.inspect.outputs.eligible == 'true'
        uses: actions/download-artifact@v8.0.2
        with:
          artifact-ids: ${{ steps.inspect.outputs.artifact-id }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          path: ${{ runner.temp }}/phar-update
          merge-multiple: true
      - name: Validate bounded artifact data before selecting a writer
        if: steps.inspect.outputs.eligible == 'true'
        uses: actions/github-script@v9
        env:
          PHAR_CANDIDATE: ${{ steps.inspect.outputs.candidate }}
          PHAR_DIRECTORY: ${{ runner.temp }}/phar-update
        with:
          script: |
            require('./.github/PharCommit/commit.cjs').validateCandidate({
              directory: process.env.PHAR_DIRECTORY,
              candidate: JSON.parse(process.env.PHAR_CANDIDATE)
            });
      - name: Select the existing repository App for this single-file commit
        if: steps.inspect.outputs.eligible == 'true'
        id: writer
        uses: actions/create-github-app-token@v3.3.0
        with:
          client-id: 'Iv23liHqRng02H747IYa'
          private-key: ${{ secrets.RELEASE_CHANNEL_APP_PRIVATE_KEY }}
          owner: php-fast-forward
          repositories: code-standards
          permission-contents: write
          skip-token-revoke: 'false'
      - name: Commit only to the inspected unchanged PR head
        if: steps.inspect.outputs.eligible == 'true'
        uses: actions/github-script@v9
        env:
          PHAR_CANDIDATE: ${{ steps.inspect.outputs.candidate }}
          PHAR_DIRECTORY: ${{ runner.temp }}/phar-update
          PHAR_WRITER_TOKEN: ${{ steps.writer.outputs.token }}
        with:
          script: |
            const writer = getOctokit(process.env.PHAR_WRITER_TOKEN);
            const result = await require('./.github/PharCommit/commit.cjs').commit({
              reader: github, writer, context, core,
              candidate: JSON.parse(process.env.PHAR_CANDIDATE),
              directory: process.env.PHAR_DIRECTORY
            });
            core.info(JSON.stringify(result));
