name: 'Repository: Release Channels'
on:
  workflow_call:
    inputs:
      tag:
        description: Existing published stable 0.x full release tag.
        type: string
        required: true
      expected-sha:
        description: Exact commit of the verified published release.
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Existing published stable 0.x full release tag.
        type: string
        required: true
      expected-sha:
        description: Exact commit of the verified published release.
        type: string
        required: true
permissions: {}
concurrency:
  group: release-channels-${{ github.repository }}
  cancel-in-progress: false
jobs:
  channel:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Require a trusted repository workflow
        id: runtime
        env:
          FF_REPOSITORY: ${{ github.repository }}
          FF_JOB_JSON: ${{ toJSON(job) }}
          FF_EVENT: ${{ github.event_name }}
          FF_REF: ${{ github.ref }}
          FF_ACTION: ${{ github.event.action }}
          FF_MERGED: ${{ github.event.pull_request.merged }}
          FF_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          FF_HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          FF_BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
          FF_MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          FF_EXPECTED_SHA: ${{ inputs.expected-sha }}
        run: |
          set -euo pipefail
          if [[ "$FF_REPOSITORY" != php-fast-forward/code-standards ]]; then
            echo '::error::Release channels belong only to the canonical repository.'
            exit 1
          fi
          if [[ "$FF_EVENT" == workflow_dispatch ]]; then
            [[ "$FF_REF" == refs/heads/main ]] || exit 1
          elif [[ "$FF_EVENT" != pull_request_target || "$FF_ACTION" != closed \
              || "$FF_MERGED" != true || "$FF_HEAD_REPOSITORY" != "$FF_REPOSITORY" \
              || "$FF_HEAD_BRANCH" != changelog/version || "$FF_BASE_BRANCH" != main \
              || "$FF_MERGE_SHA" != "$FF_EXPECTED_SHA" ]]; then
            echo '::error::Use verified managed-merge publication or manual recovery from main.'
            exit 1
          fi
          runtime=$(jq --slurp --raw-output --exit-status '
            select(length == 1) | .[0] | select(type == "object")
            | select(.workflow_repository | type == "string")
            | select(.workflow_repository == "php-fast-forward/code-standards")
            | select(.workflow_sha | type == "string")
            | select(.workflow_sha | length == 40 and test("^[a-f0-9]+$"))
            | .workflow_sha
          ' <<< "$FF_JOB_JSON") || {
            echo '::error::Invalid executing workflow identity in native job context.' >&2
            exit 1
          }
          {
            printf 'repository=php-fast-forward/code-standards\n'
            printf 'sha=%s\n' "$runtime"
          } >> "$GITHUB_OUTPUT"
      - name: Check out this exact trusted implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ steps.runtime.outputs.repository }}
          ref: ${{ steps.runtime.outputs.sha }}
          persist-credentials: false
      - uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc # 2.37.1
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2
      - name: Install repository-only verification dependencies
        env:
          COMPOSER_HOME: ${{ runner.temp }}/release-channel-composer-home
          COMPOSER_CACHE_DIR: ${{ runner.temp }}/release-channel-composer-cache
        run: composer install --no-plugins --no-scripts --no-interaction --prefer-dist --no-progress
      - name: Advance the verified released v0 branch
        env:
          GH_TOKEN: ${{ github.token }}
          FF_REPOSITORY: ${{ github.repository }}
          FF_TAG: ${{ inputs.tag }}
          FF_EXPECTED_SHA: ${{ inputs.expected-sha }}
        run: php .github/update-release-channels.php "$FF_REPOSITORY" "$FF_TAG" "$FF_EXPECTED_SHA"
