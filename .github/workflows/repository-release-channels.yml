name: 'Repository: Release Channels'
on:
  release:
    types: [published, edited]
permissions: {}
concurrency:
  group: release-channels-${{ github.repository }}
  cancel-in-progress: false
jobs:
  channel:
    if: >-
      github.repository == 'php-fast-forward/code-standards' &&
      github.event.release.draft == false && github.event.release.prerelease == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: release-channels
    permissions:
      contents: read
    steps:
      - name: Select the newest stable release for its major
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          FF_RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/tags?per_page=100" --jq '.[].name' > "$RUNNER_TEMP/release-tags"
          php <<'PHP'
          <?php
          $tag = getenv('FF_RELEASE_TAG');
          $pattern = '/^v(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)$/D';
          if (!preg_match($pattern, $tag)) {
              throw new RuntimeException('The release version cannot be compared.');
          }
          $major = explode('.', $tag)[0];
          $promote = $latest = true;
          foreach (file(getenv('RUNNER_TEMP') . '/release-tags', FILE_IGNORE_NEW_LINES) as $other) {
              if (preg_match($pattern, $other) && version_compare(substr($other, 1), substr($tag, 1), '>')) {
                  $latest = false;
                  if (explode('.', $other)[0] === $major) {
                      $promote = false;
                  }
              }
          }
          file_put_contents(getenv('GITHUB_OUTPUT'), 'promote=' . ($promote ? 'true' : 'false') . "\nlatest=" . ($latest ? 'true' : 'false') . "\n", FILE_APPEND);
          PHP
      - name: Create the repository-scoped channel token
        if: steps.release.outputs.promote == 'true'
        id: channel-app
        uses: actions/create-github-app-token@v3.3.0
        with:
          client-id: ${{ vars.RELEASE_CHANNEL_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_CHANNEL_APP_PRIVATE_KEY }}
          owner: php-fast-forward
          repositories: code-standards
          permission-contents: write
          permission-workflows: write
          skip-token-revoke: 'false'
      - name: Update the released major branch
        if: steps.release.outputs.promote == 'true'
        uses: Actions-R-Us/actions-tagger@v2.0.3
        with:
          token: ${{ steps.channel-app.outputs.token }}
          prefer_branch_releases: 'true'
          publish_latest_tag: ${{ steps.release.outputs.latest }}
