# Copy this caller into the consumer's .github/workflows/code-standards.yml.
# The executable reusable remains in the called repository's .github/workflows/.
name: PHP standards
on:
  pull_request:
permissions:
  contents: read
jobs:
  standards:
    uses: php-fast-forward/code-standards/.github/workflows/code-standards.yml@v0
    with:
      php-version: '8.3'
